services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_WEB_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_auth:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
    ports:
      - "${POSTGRES_AUTH_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_content:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_CONTENT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CONTENT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CONTENT_DB}
    ports:
      - "${POSTGRES_CONTENT_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CONTENT_USER} -d ${POSTGRES_CONTENT_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_business:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_BUSINESS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_BUSINESS_PASSWORD}
      POSTGRES_DB: ${POSTGRES_BUSINESS_DB}
    ports:
      - "${POSTGRES_BUSINESS_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BUSINESS_USER} -d ${POSTGRES_BUSINESS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"

  auth-service:
    build: ./auth_service
    ports:
      - "${AUTH_SERVICE_PORT}:50051"
    env_file:
      - .env
    depends_on:
      postgres_auth:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  content-service:
    build: ./content_service
    ports:
      - "${CONTENT_SERVICE_PORT}:50051"
    env_file:
      - .env
    depends_on:
      postgres_content:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  business-service:
    build: ./business_service
    ports:
      - "${BUSINESS_SERVICE_PORT}:50051"
    env_file:
      - .env
    depends_on:
      postgres_business:
        condition: service_healthy
    

  rabbit_worker:
    build: ./rabbit_worker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    ports:
      - "${API_GATEWAY_PORT}:8080"
    env_file:
      - .env

volumes:
  rabbitmq_data:
  redis_data:
