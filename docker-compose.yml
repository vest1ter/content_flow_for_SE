x-python-service: &python-service
  env_file:
    - .env
  restart: on-failure

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_WEB_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_auth:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
    ports:
      - "${POSTGRES_AUTH_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_content:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_CONTENT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CONTENT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CONTENT_DB}
    ports:
      - "${POSTGRES_CONTENT_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CONTENT_USER} -d ${POSTGRES_CONTENT_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_business:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_BUSINESS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_BUSINESS_PASSWORD}
      POSTGRES_DB: ${POSTGRES_BUSINESS_DB}
    ports:
      - "${POSTGRES_BUSINESS_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BUSINESS_USER} -d ${POSTGRES_BUSINESS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Образ minio/minio удалён с Docker Hub (см. журнал запуска в docs/00-project.md)
    image: bitnamilegacy/minio:2025.7.23
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/bitnami/minio/data

  auth-service:
    <<: *python-service
    build: ./src/auth_service
    ports:
      - "${AUTH_SERVICE_PORT}:50051"
    environment:
      APP_CONFIG__DB__URL: postgresql+psycopg2://${POSTGRES_AUTH_USER}:${POSTGRES_AUTH_PASSWORD}@postgres_auth:5432/${POSTGRES_AUTH_DB}
    depends_on:
      postgres_auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  business-service:
    <<: *python-service
    build: ./src/business_service
    ports:
      - "${BUSINESS_SERVICE_PORT}:50051"
    environment:
      APP_CONFIG__DB__URL: postgresql+psycopg2://${POSTGRES_BUSINESS_USER}:${POSTGRES_BUSINESS_PASSWORD}@postgres_business:5432/${POSTGRES_BUSINESS_DB}
    depends_on:
      postgres_business:
        condition: service_healthy
      minio:
        condition: service_started

  content-service:
    <<: *python-service
    build: ./src/content_service
    ports:
      - "${CONTENT_SERVICE_PORT}:50051"
    environment:
      APP_CONFIG__DB__URL: postgresql+psycopg2://${POSTGRES_CONTENT_USER}:${POSTGRES_CONTENT_PASSWORD}@postgres_content:5432/${POSTGRES_CONTENT_DB}
    depends_on:
      postgres_content:
        condition: service_healthy
      minio:
        condition: service_started

  rabbit_worker:
    <<: *python-service
    build: ./src/rabbit_worker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build: ./src/api-gateway
    ports:
      - "${API_GATEWAY_PORT}:8080"
    env_file:
      - .env
    restart: on-failure
    depends_on:
      - auth-service
      - business-service
      - content-service

  frontend:
    build:
      context: ./src/frontend
      args:
        REACT_APP_API_URL: http://localhost:${API_GATEWAY_PORT}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - api-gateway

volumes:
  rabbitmq_data:
  redis_data:
  minio_data:
